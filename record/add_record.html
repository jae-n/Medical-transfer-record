<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Add Medical Record</title>
</head>
<body>
  <h1>Add Medical Record</h1>

  <form action="../../php/add_record.php" method="post">
    <label for="rid">Record ID:</label>
    <input type="number" id="rid" name="rid" required />
    <br />

    <label for="pid">Patient ID:</label>
    <input type="number" id="pid" name="pid" required />
    <br />

    <label for="doc_id">Doctor ID:</label>
    <input type="number" id="doc_id" name="docID" />
    <br />

    <label for="diagnosis">Diagnosis:</label><br />
    <textarea id="diagnosis" name="diagnosis" rows="3" cols="40"></textarea>
    <br />

    <label for="treatment">Treatment:</label><br />
    <textarea id="treatment" name="treatment" rows="3" cols="40"></textarea>
    <br />

    <label for="hospital">Hospital:</label>
    <input type="text" id="hospital" name="hospitalName" />
    <br /><br />

    <button type="submit">Save Record</button>
  </form>

  <p><a href="../index.html">Back to Home</a></p>
</body>
</html>
