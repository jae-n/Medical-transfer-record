<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Add Patient</title>
</head>
<body>
  <h1>Add Patient</h1>

  <form action="../../php/add_patient.php" method="post">
    <label for="pid">Patient ID:</label>
    <input type="number" id="pid" name="pid" required />
    <br />

    <label for="pname">Name:</label>
    <input type="text" id="pname" name="name" required />
    <br />

    <label for="gender">Gender:</label>
    <input type="text" id="gender" name="gender" />
    <br />

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" />
    <br />

    <label for="phone">Phone (10-11 digits):</label>
    <input type="tel" id="phone" name="phone" pattern="[0-9]{10,11}" title="Please enter 10 or 11 digits" required />
    <br /><br />

    <button type="submit">Save Patient</button>
  </form>

  <p><a href="../index.html">Back to Home</a></p>
</body>
</html>
