<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Schedule Appointment</title>
</head>
<body>
  <h1>Schedule Appointment</h1>

  <form action="../../php/schedule_appointment.php" method="post">
    <label for="app_id">Appointment ID:</label>
    <input type="number" id="app_id" name="appID" required />
    <br />

    <label for="app_date">Date:</label>
    <input type="date" id="app_date" name="appDate" required />
    <br />

    <label for="pid">Patient ID:</label>
    <input type="number" id="pid" name="pid" required />
    <br />

    <label for="doc_id">Doctor ID:</label>
    <input type="number" id="doc_id" name="docID" required />
    <br />

    <label for="status">Status:</label>
    <select id="status" name="status" required>
        <option value="">-- Select Status --</option>
        <option value="Requested">Requested</option>
        <option value="Approved">Approved</option>
        <option value="Cancelled">Cancelled</option>
    </select>
    <br /><br />


    <button type="submit">Save Appointment</button>
  </form>

  <p><a href="../index.html">Back to Home</a></p>
</body>
</html>
