<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Update Appointment</title>
</head>
<body>
  <h1>Update Appointment</h1>

  <form action="../../php/update_appointment.php" method="post">
    <p><strong>Note:</strong> Appointment ID must already exist.</p>

    <label for="app_id">Appointment ID:</label>
    <input type="number" id="app_id" name="appID" required />
    <br />

    <label for="app_date">Appointment Date:</label>
    <input type="date" id="app_date" name="appDate"/>
    <br />

    <label for="pid">Patient ID:</label>
    <input type="number" id="pid" name="pid"/>
    <br />

    <label for="doc_id">Doctor ID:</label>
    <input type="number" id="doc_id" name="docID"/>
    <br />

    <label for="status">Status:</label>
    <select id="status" name="status">
      <option value="">--Select--</option>
      <option value="Requested">Requested</option>
      <option value="Approved">Approved</option>
      <option value="Cancelled">Cancelled</option>
    </select>
    <br /><br />

    <button type="submit">Update Appointment</button>
  </form>

  <p><a href="schedule_appointment.html">Schedule New Appointment</a></p>
  <p><a href="../index.html">Back to Home</a></p>
</body>
</html>
