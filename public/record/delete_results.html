<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Doctor Deletion Result</title>
</head>
<body>
  <h1>Doctor Deletion Result</h1>

  <!-- SUCCESS MESSAGE -->
  <div id="success" style="color: green; display: none;">
    <h2>Doctor Deleted Successfully</h2>
    <p><strong>Doctor ID:</strong> <span id="docID"></span></p>
    <p><strong>Employee Name:</strong> <span id="empName"></span></p>
    <p><strong>Specialization:</strong> <span id="spec"></span></p>
  </div>

  <!-- ERROR MESSAGE -->
  <div id="error" style="color: red; display: none;">
    <h2>Deletion Failed</h2>
    <p id="errorMsg"></p>
  </div>

  <p><a href="delete_doctor.html">Back to Delete Form</a></p>
  <p><a href="../index.html">Back to Home</a></p>

  <script>
    // Read URL parameters from the PHP redirect
    const params = new URLSearchParams(window.location.search);

    if (params.get("status") === "success") {
      document.getElementById("success").style.display = "block";
      document.getElementById("docID").textContent = params.get("docID");
      document.getElementById("empName").textContent = params.get("empName");
      document.getElementById("spec").textContent = params.get("specialization");
    } else {
      document.getElementById("error").style.display = "block";
      document.getElementById("errorMsg").textContent =
        params.get("message") || "Unknown error.";
    }
  </script>
</body>
</html>
