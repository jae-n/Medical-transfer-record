<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Update Employee</title>
</head>
<body>
  <h1>Update Employee</h1>

  <form action="../../php/update_employee.php" method="post">
    <p><strong>Note:</strong> Employee ID must already exist.</p>

    <label for="eid">Employee ID:</label>
    <input type="number" id="eid" name="empID" required />
    <br />

    <label for="ename">Name:</label>
    <input type="text" id="ename" name="name"/>
    <br />

    <label for="startDate">Start Date:</label>
    <input type="date" id="startDate" name="startDate"/>
    <br />

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" />
    <br />

    <label for="phone">Phone (10-11 digits):</label>
    <input type="tel" id="phone" name="phone" pattern="[0-9]{10,11}" title="Please enter 10 or 11 digits"/>
    <br />

    <label for="shift">Shift:</label>
    <select id="shift" name="shift">
      <option value="">--Select--</option>
      <option value="day">Day</option>
      <option value="night">Night</option>
    </select>
    <br />

    <label for="role">Role:</label>
    <select id="role" name="role">
      <option value="">--Select--</option>
      <option value="Immediate Responder">Immediate Responder</option>
      <option value="Administrative Staff">Administrative Staff</option>
      <option value="Scheduled Staff">Scheduled Staff</option>
    </select>
    <br /><br />

    <button type="submit">Update Employee</button>
  </form>

  <p><a href="../index.html">Back to Home</a></p>
</body>
</html>
